<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3b24" />
      <stop offset="100%" stop-color="#051d11" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" stroke="#d97706" stroke-width="12" />
  <circle cx="256" cy="256" r="216" fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.6" stroke-dasharray="8 6" />

  <!-- Central Wheat Sheaf / Grain Ear -->
  <path d="M256,380 L256,140" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
  
  <!-- Grain Kernels -->
  <ellipse cx="256" cy="130" rx="14" ry="22" fill="url(#goldGrad)" />
  
  <g transform="translate(256, 170) rotate(-35)"><ellipse cx="0" cy="0" rx="16" ry="26" fill="url(#goldGrad)" /></g>
  <g transform="translate(256, 170) rotate(35)"><ellipse cx="0" cy="0" rx="16" ry="26" fill="url(#goldGrad)" /></g>
  
  <g transform="translate(256, 215) rotate(-40)"><ellipse cx="0" cy="0" rx="18" ry="30" fill="url(#goldGrad)" /></g>
  <g transform="translate(256, 215) rotate(40)"><ellipse cx="0" cy="0" rx="18" ry="30" fill="url(#goldGrad)" /></g>
  
  <g transform="translate(256, 260) rotate(-42)"><ellipse cx="0" cy="0" rx="19" ry="32" fill="url(#goldGrad)" /></g>
  <g transform="translate(256, 260) rotate(42)"><ellipse cx="0" cy="0" rx="19" ry="32" fill="url(#goldGrad)" /></g>
  
  <g transform="translate(256, 305) rotate(-45)"><ellipse cx="0" cy="0" rx="18" ry="30" fill="url(#goldGrad)" /></g>
  <g transform="translate(256, 305) rotate(45)"><ellipse cx="0" cy="0" rx="18" ry="30" fill="url(#goldGrad)" /></g>

  <!-- Industrial Gear Arc -->
  <path d="M120,320 A150,150 0 0,0 392,320" fill="none" stroke="#d97706" stroke-width="10" stroke-linecap="round" stroke-dasharray="14 10" />

  <!-- Text -->
  <text x="256" y="425" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="28" fill="#f8fafc" letter-spacing="4">GRAINMASTER</text>
  <text x="256" y="450" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="14" fill="#fbbf24" letter-spacing="3">AGRO SOLUTIONS</text>
</svg>
